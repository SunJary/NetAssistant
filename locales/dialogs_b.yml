    zh-CN: 条件
    en: Condition
  label_action:
    zh-CN: 动作
    en: Action
  badge_disabled:
    zh-CN: 已禁用
    en: Disabled
  badge_any_message:
    zh-CN: 任意消息
    en: Any message
  edit:
    zh-CN: 编辑
    en: Edit
  duplicate:
