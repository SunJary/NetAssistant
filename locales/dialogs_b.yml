variable_picker:
  title:
    zh-CN: 插入变量
    en: Insert Variable
  desc_seq:
    zh-CN: "全局递增序号, 所有 worker 共享"
    en: "Global incrementing sequence number, shared by all workers"
  desc_worker_id:
    zh-CN: 当前工作线程编号
    en: Current worker thread ID
  desc_counter:
    zh-CN: "线程本地计数器, 每包 +1"
    en: "Thread-local counter, +1 per packet"
  desc_timestamp:
    zh-CN: 当前毫秒时间戳
    en: Current timestamp in milliseconds
  desc_uuid:
    zh-CN: 随机 UUID v4
    en: Random UUID v4
  desc_random:
    zh-CN: "区间随机整数, 如 ${random:1:100}"
    en: "Random integer within a range, e.g. ${random:1:100}"
  desc_date:
    zh-CN: "当前日期, 如 2026-09-26"
    en: "Current date, e.g. 2026-09-26"
  desc_time:
    zh-CN: "当前时间, 如 14:30:05"
    en: "Current time, e.g. 14:30:05"
  desc_datetime:
    zh-CN: "日期与时间, 如 2026-09-26 14:30:05"
    en: "Date and time, e.g. 2026-09-26 14:30:05"
  desc_datetime_ms:
    zh-CN: "日期与时间(含毫秒)"
    en: "Date and time with milliseconds"
  desc_iso:
    zh-CN: "ISO 8601 本地时间(带时区偏移)"
    en: "ISO 8601 local time with timezone offset"
  desc_utc:
    zh-CN: "ISO 8601 UTC 时间(以 Z 结尾)"
    en: "ISO 8601 UTC time (ends with Z)"
  desc_timestamp_s:
    zh-CN: 当前秒级时间戳
    en: Current timestamp in seconds
  desc_time_custom:
    zh-CN: "自定义时间格式(可改成任意 strftime 格式)"
    en: "Custom time format (any strftime format)"
  desc_seq_common:
    zh-CN: "递增序号, 每条消息 +1"
    en: "Incrementing sequence number, +1 per message"
  hint:
    zh-CN: "提示: 点击输入框定位光标, 变量会插入到光标处; Hex 模式下数值变量自动转为十六进制"
    en: "Tip: Click in the input to place the cursor; variables are inserted at the cursor. In Hex mode, numeric variables are automatically converted to hexadecimal"
  group_common:
    zh-CN: 通用变量
    en: General
  group_rx:
    zh-CN: 接收帧变量
    en: Received Frame
  group_checksum:
    zh-CN: 生成校验（发送时填充）
    en: Generated Checksum (filled on send)
  group_expr:
    zh-CN: 表达式
    en: Expressions
  desc_rx_raw:
    zh-CN: 触发本条规则的整帧内容（原样）
    en: The whole frame that triggered this rule (verbatim)
  desc_rx_raw_slice:
    zh-CN: "接收帧的第 0 字节起 4 字节"
    en: "4 bytes of the received frame starting at offset 0"
  desc_rx_len:
    zh-CN: 接收帧长度（字节）
    en: Length of the received frame in bytes
  desc_rx_src:
    zh-CN: "来源地址, 如 192.168.1.9:5000"
    en: "Source address, e.g. 192.168.1.9:5000"
  desc_rx_src_ip:
    zh-CN: 来源 IP（不含端口）
    en: Source IP (without port)
  desc_rx_port:
    zh-CN: 来源端口
    en: Source port
  desc_rx_u8:
    zh-CN: "接收帧偏移 0 处的 1 字节无符号整数"
    en: "Unsigned 8-bit value at offset 0 of the received frame"
  desc_rx_u16be:
    zh-CN: 接收帧大端 16 位无符号整数
    en: Big-endian unsigned 16-bit value of the received frame
  desc_rx_u16le:
    zh-CN: 接收帧小端 16 位无符号整数
    en: Little-endian unsigned 16-bit value of the received frame
  desc_rx_i32be:
    zh-CN: 接收帧大端 32 位有符号整数
    en: Big-endian signed 32-bit value of the received frame
  desc_rx_hex:
    zh-CN: 接收帧某段字节的十六进制文本
    en: Hex text of a byte range of the received frame
  desc_rx_ascii:
    zh-CN: 接收帧某段字节的 ASCII 文本
    en: ASCII text of a byte range of the received frame
  desc_rx_crc16modbus:
    zh-CN: 对接收帧某段字节现算 CRC16/MODBUS
    en: Compute CRC16/MODBUS over a byte range of the received frame
  desc_rx_json:
    zh-CN: 接收帧 JSON 字段取值（路径如 action / data.items[0].temp）
    en: JSON field of the received frame (path like action / data.items[0].temp)
  desc_gen_crc16modbus:
    zh-CN: 对**应答内容**现算 CRC16/MODBUS（大端）
    en: Compute CRC16/MODBUS over the reply payload (big-endian)
  desc_gen_crc16modbus_le:
    zh-CN: 对**应答内容**现算 CRC16/MODBUS（小端，Modbus RTU 用）
    en: Compute CRC16/MODBUS over the reply payload (little-endian, for Modbus RTU)
  desc_gen_xor:
    zh-CN: 对**应答内容**现算异或校验（1 字节）
    en: Compute XOR checksum over the reply payload (1 byte)
  desc_gen_sum8:
    zh-CN: 对**应答内容**现算累加和（1 字节）
    en: Compute 8-bit sum over the reply payload (1 byte)
  desc_gen_lrc:
    zh-CN: 对**应答内容**现算 Modbus LRC（1 字节）
    en: Compute Modbus LRC over the reply payload (1 byte)
  desc_gen_crc32:
    zh-CN: 对**应答内容**现算 CRC32（4 字节）
    en: Compute CRC32 over the reply payload (4 bytes)
  desc_expr_arith:
    zh-CN: 算术表达式（支持 + - * / % 与括号）
    en: Arithmetic expression (supports + - * / % and parentheses)
  desc_expr_rx:
    zh-CN: 表达式里读取接收帧数值
    en: Read a value from the received frame inside an expression
  desc_expr_if:
    zh-CN: 条件表达式（if(条件, 真值, 假值)）
    en: Conditional expression (if(cond, then, else))
  desc_expr_bits:
    zh-CN: 取某值的位段（起始位, 位数）
    en: Extract a bit field (start bit, length)

