  section_time_wait:
    zh-CN: "TCP 短连接与 TIME_WAIT"
    en: "TCP Short Connections and TIME_WAIT"
    ja: "TCP ショートコネクションと TIME_WAIT"
    de: "TCP-Kurzverbindungen und TIME_WAIT"
    ru: "Короткие TCP-соединения и TIME_WAIT"
    pt-BR: "Conexões curtas TCP e TIME_WAIT"
    es: "Conexiones TCP cortas y TIME_WAIT"
  time_wait_desc_1:
    zh-CN: "TCP 连接由四元组 (源IP, 源端口, 目标IP, 目标端口) 唯一标识。压测同一目标时，源IP / 目标IP / 目标端口三者固定，只有源端口可变。短连接关闭后，该四元组进入 TIME_WAIT 状态 (60-120秒)，期间此端口不能被同一程序用于连接同一目标。"
    en: "A TCP connection is uniquely identified by the 4-tuple (source IP, source port, target IP, target port). When stress testing the same target, the source IP, target IP, and target port are fixed, leaving only the source port variable. After a short connection closes, the 4-tuple enters the TIME_WAIT state (60-120 seconds), during which this port cannot be used by the same program to connect to the same target."
    ja: "TCP 接続は 4 タプル (送信元 IP、送信元ポート、宛先 IP、宛先ポート) で一意に識別されます。同一ターゲットへの負荷テストでは送信元 IP・宛先 IP・宛先ポートが固定され、変化するのは送信元ポートのみです。ショートコネクションを閉じると、その 4 タプルは TIME_WAIT 状態 (60～120 秒) に入り、その間このポートを同じプログラムから同じターゲットへの接続に使用できません。"
    de: "Eine TCP-Verbindung wird eindeutig durch das 4-Tupel (Quell-IP, Quellport, Ziel-IP, Zielport) identifiziert. Beim Lasttest auf dasselbe Ziel sind Quell-IP, Ziel-IP und Zielport fest, nur der Quellport ist variabel. Nach dem Schließen einer kurzen Verbindung geht das 4-Tupel in den Zustand TIME_WAIT über (60-120 Sekunden); währenddessen kann dieser Port vom selben Programm nicht für eine Verbindung zum selben Ziel verwendet werden."
    ru: "TCP-соединение однозначно определяется четвёркой (IP источника, порт источника, IP назначения, порт назначения). При нагрузке на одну цель IP источника, IP назначения и порт назначения фиксированы, меняется только порт источника. После закрытия короткого соединения эта четвёрка переходит в состояние TIME_WAIT (60-120 секунд), и в течение этого времени порт нельзя использовать той же программе для подключения к той же цели."
    pt-BR: "Uma conexão TCP é identificada de forma única pela 4-tupla (IP de origem, porta de origem, IP de destino, porta de destino). Ao testar o mesmo destino, o IP de origem, o IP de destino e a porta de destino são fixos, restando apenas a porta de origem variável. Após o fechamento de uma conexão curta, essa 4-tupla entra no estado TIME_WAIT (60-120 segundos), período em que a porta não pode ser usada pelo mesmo programa para conectar ao mesmo destino."
    es: "Una conexión TCP se identifica de forma única mediante la cuádrupla (IP de origen, puerto de origen, IP de destino, puerto de destino). Al realizar una prueba de carga sobre el mismo destino, la IP de origen, la IP de destino y el puerto de destino son fijos, y solo varía el puerto de origen. Tras cerrarse una conexión corta, la cuádrupla entra en estado TIME_WAIT (60-120 segundos), durante el cual ese puerto no puede ser usado por el mismo programa para conectar con el mismo destino."
  time_wait_desc_2:
    zh-CN: "稳态下短连接占用的端口数 ≈ 并发数 × (TIME_WAIT时长 / 发包间隔)。发包间隔越短，端口消耗放大越严重，建议改用长连接模式或降低并发。"
    en: "In steady state, ports used by short connections ≈ concurrency × (TIME_WAIT duration / send interval). The shorter the send interval, the more severe the port consumption amplification. Consider switching to long connection mode or lowering concurrency."
    ja: "定常状態でショートコネクションが使用するポート数 ≈ 同時接続数 × (TIME_WAIT 時間 / 送信間隔)。送信間隔が短いほどポート消費が拡大するため、ロングコネクションモードへの変更や同時接続数の削減を推奨します。"
    de: "Im Beharrungszustand gilt: von kurzen Verbindungen belegte Ports ≈ Parallelität × (TIME_WAIT-Dauer / Sendeintervall). Je kürzer das Sendeintervall, desto stärker steigt der Portverbrauch. Wechseln Sie daher möglichst in den Modus für persistente Verbindungen oder reduzieren Sie die Parallelität."
    ru: "В установившемся режиме число портов, занятых короткими соединениями, ≈ параллельность × (длительность TIME_WAIT / интервал отправки). Чем короче интервал, тем сильнее растёт расход портов. Рекомендуем перейти на длинные соединения или снизить параллельность."
    pt-BR: "Em regime estável, as portas usadas por conexões curtas ≈ concorrência × (duração do TIME_WAIT / intervalo de envio). Quanto menor o intervalo de envio, maior a amplificação do consumo de portas; considere usar o modo de conexão longa ou reduzir a concorrência."
    es: "En estado estacionario, los puertos ocupados por conexiones cortas ≈ concurrencia × (duración de TIME_WAIT / intervalo de envío). Cuanto más corto sea el intervalo de envío, mayor será la amplificación del consumo de puertos; se recomienda cambiar al modo de conexión persistente o reducir la concurrencia."
  udp_desc:
    zh-CN: "UDP 不走 TCP 连接，无 TIME_WAIT 问题，端口消耗仅与并发数相关。"
    en: "UDP does not establish TCP connections and has no TIME_WAIT issue; port consumption depends only on concurrency."
    ja: "UDP は TCP 接続を使用しないため TIME_WAIT の問題はなく、ポート消費は同時接続数のみに依存します。"
    de: "UDP baut keine TCP-Verbindungen auf und hat kein TIME_WAIT-Problem; der Portverbrauch hängt nur von der Parallelität ab."
    ru: "UDP не устанавливает TCP-соединений, проблемы TIME_WAIT нет; расход портов зависит только от параллельности."
    pt-BR: "O UDP não estabelece conexões TCP e não tem problema de TIME_WAIT; o consumo de portas depende apenas da concorrência."
    es: "UDP no establece conexiones TCP y no tiene el problema de TIME_WAIT; el consumo de puertos depende solo de la concurrencia."
  section_over_limit:
    zh-CN: 超过端口上限会怎样
    en: "What Happens When the Port Limit Is Exceeded"
    ja: "ポート上限を超えるとどうなるか"
    de: "Was passiert bei Überschreitung der Port-Obergrenze"
    ru: "Что произойдёт при превышении лимита портов"
    pt-BR: "O que acontece ao exceder o limite de portas"
    es: "Qué ocurre al superar el límite de puertos"
  over_limit_desc:
    zh-CN: "并发超过临时端口范围时，新建连接会报 AddrNotAvailable (Linux/macOS) 或 WSAEADDRINUSE (Windows) 错误，压测的连接失败率会骤升。NetAssistant 会在压测结束后的 stress_failure_*.log 中给出诊断建议。"
    en: "When concurrency exceeds the ephemeral port range, new connections fail with AddrNotAvailable (Linux/macOS) or WSAEADDRINUSE (Windows), and the connection failure rate of the stress test spikes. NetAssistant provides diagnostic suggestions in stress_failure_*.log after the stress test ends."
    ja: "同時接続数が一時ポート範囲を超えると、新規接続時に AddrNotAvailable (Linux/macOS) または WSAEADDRINUSE (Windows) エラーが発生し、負荷テストの接続失敗率が急上昇します。NetAssistant は負荷テスト終了後に stress_failure_*.log へ診断のヒントを出力します。"
    de: "Übersteigt die Parallelität den Bereich der temporären Ports, schlagen neue Verbindungen mit AddrNotAvailable (Linux/macOS) oder WSAEADDRINUSE (Windows) fehl, und die Verbindungsfehlerrate des Lasttests steigt sprunghaft an. NetAssistant gibt nach dem Lasttest in stress_failure_*.log Diagnosehinweise aus."
    ru: "Если параллельность превышает диапазон временных портов, новые соединения завершаются ошибкой AddrNotAvailable (Linux/macOS) или WSAEADDRINUSE (Windows), и доля неудачных соединений резко возрастает. По завершении теста NetAssistant даёт рекомендации в файле stress_failure_*.log."
    pt-BR: "Quando a concorrência excede a faixa de portas efêmeras, novas conexões falham com AddrNotAvailable (Linux/macOS) ou WSAEADDRINUSE (Windows), e a taxa de falha de conexão do teste dispara. O NetAssistant fornece sugestões de diagnóstico em stress_failure_*.log após o término do teste."
    es: "Cuando la concurrencia supera el rango de puertos efímeros, las nuevas conexiones fallan con AddrNotAvailable (Linux/macOS) o WSAEADDRINUSE (Windows), y la tasa de fallos de conexión de la prueba de carga se dispara. NetAssistant ofrece sugerencias de diagnóstico en stress_failure_*.log al finalizar la prueba de carga."
  note_permission:
    zh-CN: "注: 应用自身的端口范围检测全程只需普通用户权限，不涉及提权。调优命令需用户自行以管理员身份执行。"
    en: "Note: The app's own port range detection only requires normal user privileges throughout, with no elevation involved. Tuning commands must be executed by the user with administrator privileges."
    ja: "注: アプリ自身のポート範囲検出はすべて一般ユーザー権限で実行でき、権限昇格は不要です。チューニングコマンドはユーザー自身が管理者権限で実行してください。"
    de: "Hinweis: Die Erkennung des Portbereichs durch die Anwendung erfordert durchgängig nur normale Benutzerrechte, ohne Rechteausweitung. Tuning-Befehle müssen Sie selbst mit Administratorrechten ausführen."
    ru: "Примечание: проверка диапазона портов выполняется с обычными правами пользователя, без повышения привилегий. Команды настройки нужно выполнять самостоятельно от имени администратора."
    pt-BR: "Obs.: a detecção da faixa de portas do próprio aplicativo exige apenas privilégios de usuário comum, sem elevação. Os comandos de ajuste devem ser executados pelo usuário com privilégios de administrador."
    es: "Nota: la detección del rango de puertos de la propia aplicación solo requiere privilegios de usuario normal en todo momento, sin elevación. Los comandos de ajuste debe ejecutarlos el usuario con privilegios de administrador."
