port_limit_help:
  title:
    zh-CN: 临时端口与压测并发上限说明
    en: "Ephemeral Ports and Stress Test Concurrency Limits"
  close:
    zh-CN: 关闭
    en: Close
  reading_port_config:
    zh-CN: "正在读取系统端口配置…"
    en: "Reading system port configuration…"
  port_range_summary:
    zh-CN: "%{start}-%{end} (共约 %{count} 个端口)"
    en: "%{start}-%{end} (about %{count} ports in total)"
  detect_failed:
    zh-CN: "获取失败, 请点击「重新检测」或使用下方命令手动查看"
    en: "Detection failed. Click 'Re-detect' or use the command below to check manually"
  section_current_range:
    zh-CN: 当前临时端口范围
    en: "Current Ephemeral Port Range"
  re_detect:
    zh-CN: 重新检测
    en: Re-detect
  section_time_wait:
    zh-CN: "TCP 短连接与 TIME_WAIT"
    en: "TCP Short Connections and TIME_WAIT"
  time_wait_desc_1:
    zh-CN: "TCP 连接由四元组 (源IP, 源端口, 目标IP, 目标端口) 唯一标识。压测同一目标时，源IP / 目标IP / 目标端口三者固定，只有源端口可变。短连接关闭后，该四元组进入 TIME_WAIT 状态 (60-120秒)，期间此端口不能被同一程序用于连接同一目标。"
    en: "A TCP connection is uniquely identified by the 4-tuple (source IP, source port, target IP, target port). When stress testing the same target, the source IP, target IP, and target port are fixed, leaving only the source port variable. After a short connection closes, the 4-tuple enters the TIME_WAIT state (60-120 seconds), during which this port cannot be used by the same program to connect to the same target."
  time_wait_desc_2:
    zh-CN: "稳态下短连接占用的端口数 ≈ 并发数 × (TIME_WAIT时长 / 发包间隔)。发包间隔越短，端口消耗放大越严重，建议改用长连接模式或降低并发。"
    en: "In steady state, ports used by short connections ≈ concurrency × (TIME_WAIT duration / send interval). The shorter the send interval, the more severe the port consumption amplification. Consider switching to long connection mode or lowering concurrency."
  udp_desc:
    zh-CN: "UDP 不走 TCP 连接，无 TIME_WAIT 问题，端口消耗仅与并发数相关。"
    en: "UDP does not establish TCP connections and has no TIME_WAIT issue; port consumption depends only on concurrency."
  section_over_limit:
    zh-CN: 超过端口上限会怎样
    en: "What Happens When the Port Limit Is Exceeded"
  over_limit_desc:
    zh-CN: "并发超过临时端口范围时，新建连接会报 AddrNotAvailable (Linux/macOS) 或 WSAEADDRINUSE (Windows) 错误，压测的连接失败率会骤升。NetAssistant 会在压测结束后的 stress_failure_*.log 中给出诊断建议。"
    en: "When concurrency exceeds the ephemeral port range, new connections fail with AddrNotAvailable (Linux/macOS) or WSAEADDRINUSE (Windows), and the connection failure rate of the stress test spikes. NetAssistant provides diagnostic suggestions in stress_failure_*.log after the stress test ends."
  note_permission:
    zh-CN: "注: 应用自身的端口范围检测全程只需普通用户权限，不涉及提权。调优命令需用户自行以管理员身份执行。"
    en: "Note: The app's own port range detection only requires normal user privileges throughout, with no elevation involved. Tuning commands must be executed by the user with administrator privileges."
  section_view_range:
    zh-CN: 查看当前端口范围
    en: "View Current Port Range"
  section_tune_range:
    zh-CN: 调大端口范围
    en: "Increase Port Range"
  perm_normal_user_exec:
    zh-CN: 普通用户可执行
    en: "Executable by a normal user"
  perm_normal_user_read:
    zh-CN: 普通用户可读
    en: "Readable by a normal user"
  platform_not_supported:
    zh-CN: 当前平台不支持自动检测
    en: "Automatic detection is not supported on this platform"
  tune_windows_tcp:
    zh-CN: "需管理员 CMD; 将 TCP 临时端口扩展为 10000-65535"
    en: "Requires admin CMD; extends TCP ephemeral ports to 10000-65535"
  tune_windows_ipv6:
    zh-CN: "需管理员 CMD; IPv6 也一并调大 (推荐)"
    en: "Requires admin CMD; also extends IPv6 (recommended)"
  tune_linux_sysctl:
    zh-CN: "需 sudo; 将临时端口扩展为 10000-65535"
    en: "Requires sudo; extends ephemeral ports to 10000-65535"
  tune_linux_conf:
    zh-CN: "需 sudo; 写入配置文件, 重启后生效"
    en: "Requires sudo; writes to a config file, takes effect after reboot"
  tune_macos:
    zh-CN: "需 sudo; 将起始端口从 49152 降到 32768, 扩展约 16384 个端口"
    en: "Requires sudo; lowers the start port from 49152 to 32768, adding about 16384 ports"
