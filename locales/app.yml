    zh-CN: 新版本 v%{version} 已就绪
    en: "Version v%{version} is ready"
    ja: "バージョン v%{version} の準備ができました"
    de: "Version v%{version} ist bereit"
    ru: "Версия v%{version} готова"
    pt-BR: "A versão v%{version} está pronta"
    es: "La versión v%{version} está lista"
  ready:
    zh-CN: 更新包已下载并通过校验，退出应用时会自动安装。
    en: "The update has been downloaded and verified. It installs automatically when you quit."
    ja: "更新パッケージはダウンロードと検証が完了しました。終了時に自動でインストールされます。"
    de: "Das Update wurde geladen und geprüft. Es wird beim Beenden automatisch installiert."
    ru: "Обновление загружено и проверено. Оно установится при выходе."
    pt-BR: "A atualização foi baixada e verificada. Ela será instalada ao sair."
    es: "La actualización se ha descargado y verificado. Se instalará al salir."
