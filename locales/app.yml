    ja: "インストーラーを保存しました: %{path}"
    de: "Installer gespeichert unter %{path}"
    ru: "Установщик сохранён: %{path}"
    pt-BR: "Instalador salvo em %{path}"
    es: "Instalador guardado en %{path}"
  open_folder:
