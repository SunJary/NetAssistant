update:
  title:
    zh-CN: 软件更新
    en: Software Update
    ja: "ソフトウェア更新"
    de: "Software-Update"
    ru: "Обновление программы"
    pt-BR: "Atualização do software"
    es: "Actualización de software"
  available:
    zh-CN: 发现新版本 v%{version}
    en: "New version v%{version} available"
    ja: "新しいバージョン v%{version} があります"
    de: "Neue Version v%{version} verfügbar"
    ru: "Доступна новая версия v%{version}"
    pt-BR: "Nova versão v%{version} disponível"
    es: "Nueva versión v%{version} disponible"
  downloading:
    zh-CN: 正在后台下载更新 %{percent}%（v%{version}）
    en: "Downloading update %{percent}% (v%{version})"
    ja: "更新をバックグラウンドでダウンロード中 %{percent}%（v%{version}）"
    de: "Update wird im Hintergrund geladen: %{percent} % (v%{version})"
    ru: "Загрузка обновления %{percent}% (v%{version})"
