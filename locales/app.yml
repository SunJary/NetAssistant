    pt-BR: "Falha na atualização: %{message}"
    es: "Error de actualización: %{message}"
  manual:
    zh-CN: 当前平台暂不支持自动更新，请前往下载页手动安装。
    en: "Automatic updates are not available for this platform. Please download it manually."
    ja: "このプラットフォームでは自動更新に対応していません。ダウンロードページから手動でインストールしてください。"
