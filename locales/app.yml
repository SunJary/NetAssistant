    es: "Descargando actualización %{percent}% (v%{version})"
  background_downloading:
    zh-CN: 正在后台下载安装包（约 %{size} MB），下载完成后退出应用即可自动安装。
    en: "Downloading the package in the background (~%{size} MB). It installs automatically when you quit."
    ja: "インストールパッケージをバックグラウンドでダウンロード中（約 %{size} MB）。終了時に自動でインストールされます。"
    de: "Das Paket wird im Hintergrund geladen (ca. %{size} MB) und beim Beenden automatisch installiert."
    ru: "Пакет загружается в фоне (около %{size} МБ) и установится при выходе."
    pt-BR: "Baixando o pacote em segundo plano (~%{size} MB). Ele será instalado ao sair."
    es: "Descargando el paquete en segundo plano (~%{size} MB). Se instalará al salir."
  background_downloading_unknown:
    zh-CN: 正在后台下载安装包，下载完成后退出应用即可自动安装。
    en: "Downloading the package in the background. It installs automatically when you quit."
    ja: "インストールパッケージをバックグラウンドでダウンロード中。終了時に自動でインストールされます。"
    de: "Das Paket wird im Hintergrund geladen und beim Beenden automatisch installiert."
    ru: "Пакет загружается в фоне и установится при выходе."
    pt-BR: "Baixando o pacote em segundo plano. Ele será instalado ao sair."
    es: "Descargando el paquete en segundo plano. Se instalará al salir."
