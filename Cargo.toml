[package]
name = "netassistant"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", features = ["tree-sitter"] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
anyhow = "1.0"
indexmap = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.49", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
bytes = "1.4"
smol = "2.0"
hex = "0.4"
regex = "1.10"
log = "0.4"
simple_logger = "5.0"
rust-embed = "8.0.0"
rust-i18n = "4.2"
rfd = "0.17"
dirs = "7"
encoding_rs = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
cocoa = "0.27"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winreg", "handleapi", "synchapi", "winerror", "minwinbase", "winnls"] }

[build-dependencies]
winres = "0.1"
chrono = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[package.metadata.appimage]
name = "NetAssistant"
comment = "NetAssistant - 多协议网络调试工具"
icon = "assets/icon/icon_256x256.png"
categories = ["Development", "Network"]
terminal = false


[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }
