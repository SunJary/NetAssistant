[package]
name = "netassistant"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
# gpui-fast: longbridge 优化的 GPUI 渲染/布局实现（Windows 走 DirectX 快速路径），
# gpui-kit 自带 gpui-pre-platform =0.3.9（font-kit/x11/wayland/runtime_shaders），无需再透传
gpui-kit = { version = "0.7", features = ["tree-sitter", "gpui-fast"] }
anyhow = "1.0"
indexmap = "2"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
json5 = "1.3"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.49", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
bytes = "1.4"
smol = "2.0"
hex = "0.4"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
argon2 = "0.6"
bcrypt = "0.19"
pbkdf2 = "0.13"
getrandom = "0.4"
regex = "1.10"
log = "0.4"
simple_logger = "5.0"
rust-embed = "8.0.0"
rust-i18n = "4.2"
rfd = "0.17"
dirs = "7"
encoding_rs = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# 注意: mqtt.rs 的洪泛批聚合依赖 `EventLoop.state.events`(pub 但非文档化语义),
# 升级 0.25.x 补丁版本前需回归验证批次边界与断开排空行为。
rumqttc = "0.25"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
cocoa = "0.27"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winreg", "handleapi", "synchapi", "winerror", "minwinbase", "winnls"] }

[build-dependencies]
winres = "0.1"
chrono = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[package.metadata.appimage]
name = "NetAssistant"
comment = "NetAssistant - 多协议网络调试工具"
icon = "assets/icon/icon_256x256.png"
categories = ["Development", "Network"]
terminal = false


[dev-dependencies]
gpui-kit = { version = "0.7", features = ["test-support"] }
